services:
  postgres:
    image: postgres:16-alpine
    container_name: fin-ai-postgres
    ports:
    - "15432:5432"
    environment:
    - POSTGRES_USER=fin_user
    - POSTGRES_PASSWORD=fin_pass
    - POSTGRES_DB=fin_ai
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - shared-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin_user -d fin_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: fin-ai-redis
    ports:
    - "16379:6379"
    volumes:
    - redis_data:/data
    networks:
    - shared-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.18-community
    container_name: fin-ai-neo4j
    ports:
    - "17474:7474"
    - "7687:7687"
    environment:
    - NEO4J_AUTH=neo4j/finagent123
    volumes:
    - neo4j_data:/data
    networks:
    - shared-net
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fin-ai-app
    ports:
    - 8966:8000
    env_file: .env
    environment:
    - DATABASE_URL=postgresql+asyncpg://fin_user:fin_pass@postgres:5432/fin_ai
    - REDIS_URL=redis://redis:6379
    - NEO4J_URI=bolt://neo4j:7687
    - NEO4J_USER=neo4j
    - NEO4J_PASSWORD=finagent123
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - app_data:/app/data
    - ./data:/app/data/csv:ro
    restart: unless-stopped
    networks:
    - shared-net
    depends_on:
    - postgres
    - redis
    - neo4j

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fin-ai-ingest
    env_file: .env
    environment:
    - DATABASE_URL=postgresql+asyncpg://fin_user:fin_pass@postgres:5432/fin_ai
    - REDIS_URL=redis://redis:6379
    - NEO4J_URI=bolt://neo4j:7687
    - NEO4J_USER=neo4j
    - NEO4J_PASSWORD=finagent123
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - app_data:/app/data
    - ./data:/app/data/csv:ro
    entrypoint:
    - python
    - -m
    - app.services.financial_ingest
    restart: 'no'
    networks:
    - shared-net
    depends_on:
    - postgres
    - redis

  # ── Celery Worker (AI 에이전트·인제스트 비동기 태스크) ────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fin-ai-celery-worker
    command: >
      celery -A app.celery_app worker
      --loglevel=info
      --concurrency=2
      --queues=celery
    env_file: .env
    environment:
    - DATABASE_URL=postgresql+asyncpg://fin_user:fin_pass@postgres:5432/fin_ai
    - REDIS_URL=redis://redis:6379
    - NEO4J_URI=bolt://neo4j:7687
    - NEO4J_USER=neo4j
    - NEO4J_PASSWORD=finagent123
    extra_hosts:
    - host.docker.internal:host-gateway
    volumes:
    - app_data:/app/data
    - ./data:/app/data/csv:ro
    networks:
    - shared-net
    depends_on:
    - postgres
    - redis
    - neo4j
    restart: unless-stopped

  # ── Celery Beat (시장 데이터 주기 동기화 스케줄러) ────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fin-ai-celery-beat
    command: >
      celery -A app.celery_app beat
      --loglevel=info
      --schedule=/tmp/celerybeat-schedule
    env_file: .env
    environment:
    - DATABASE_URL=postgresql+asyncpg://fin_user:fin_pass@postgres:5432/fin_ai
    - REDIS_URL=redis://redis:6379
    networks:
    - shared-net
    depends_on:
    - postgres
    - redis
    restart: unless-stopped

volumes:
  app_data: null
  neo4j_data: null
  postgres_data: null
  redis_data: null

networks:
  shared-net:
    external: true
